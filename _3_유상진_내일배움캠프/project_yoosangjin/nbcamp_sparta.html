<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 시대를 돌파할 취업 솔루션 | 내일배움캠프</title>

    <style>
        @font-face {
            font-family: 'NotoFont';
            src: url("font/NotoSansKR-Regular.ttf")format('truetype');
            font-weight: 400;
            font-size: normal;
            font-display: swap;
        }

        * {
           margin: 0;
           padding: 0;
           box-sizing: border-box; 
        }

        body {
            font-family: NotoFont sans-serif;
            color: #111;
            background: #fff;
        }

        a {
            color: inherit;
             text-decoration: none;
        }

         header {
            height: 52px;
            background: #ffffff;
            border-bottom: 1px   #eeeeee;
        }

        .header-inner {
            width: 1100px;
            height: 52px;
            margin: 0 auto;
            display: flex;
            align-items: center;
        }

         .logo img {
            width: 130px;
            display: block;
        }

        nav {
            display: flex;
            gap: 34px;
            margin-left: 45px;
            font-size: 13px;
        }

        nav a:hover {
            color: #ff0038;
        }

         .login {
            margin-left: auto;

            font-size: 13px;
        }

        .profile {
            display: inline-block;
            width: 22px;
            height: 22px;
            margin-right: 7px;
            border-radius: 50%;
            background: #eeeeee;
            text-align: center;
            line-height: 22px;
            font-size: 11px;
        }

        .sparta {
            width: 100%;
            height: 432px;
            /* background: #ff0038; */
            background-image: url("./images/banner-1.png");
            background-size: cover;
            background-position: center;
        }

        .banner-inner {
            width: 1100px;
            height: 432px;
            margin: 0 auto;
            position: relative;
        }

        .banner-title {
            position: absolute;
            left: 28px;
            top: 150px;
            width: 500px;

            font-size: 52px;
            font-weight: bold;
            color: #eee;
        }
        
        .banner-subtitle {
            position: absolute;
            left: 28px;
            top: 230px;
            width: 500px;

            font-size: 25px;
            font-weight: bold;
            color: #eee;
            letter-spacing: -2px;
        }

        .sparta img {
            width: 100%;
            display: block;
        }

        main {
            width: 1100px;
            margin: 0 auto;
            padding-top: 54px;
        }

        .main-title {
            font-size: 27px;
            margin-bottom: 40px;
        }

        .sub-title {
            font-size: 18px;
            margin-bottom: 22px;
        }

        .course-card {
            width: 240px;
        }

        .course-card img {
            width: 240px;
            height: 133px;
            display: block;
            border-radius: 8px;
        }

        .course-name {
            margin-top: 12px;
            font-size: 15px;
            font-weight: bold;
        }

        .course-period {
            margin-top: 8px;
            font-size: 13px;
            color: #999999;
        }

        .deadline {
            margin-top: 10px;
            font-size: 13px;
            color: #ff4d32;
        } 

         .chat {
            position: fixed;
            right: 28px;
            bottom: 28px;
            display: flex;
            align-items: center;
        }

        .chat-text {
            padding: 10px 14px;
            border: 1px solid #ffd2d8;
            border-radius: 20px 0 0 20px;
            background: #ffffff;
            color: #ff1744;
            font-size: 13px;
            font-weight: bold;
        }


        .chat-circle {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #ff0038;
            
            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
            font-weight: bold;
            color: #ff0038;

            position: relative;
            z-index: 1;
        }

        .chat-circle::before {
            content: "";
            width: 28px;
            height: 28px;

            background: white;
            border-radius: 50%;

            position: absolute;
            z-index: -1;
        }
        

    </style>    
</head>
<body>
    <header>
        <div class="header-inner">

            <a href="../../_1_강성수_메인페이지/project/sparta_main.html" class="logo">           
                <img src="./images/logo.png"  alt="내일배움캠프 로고">
            </a>

            <nav>

                <a href="#">부트캠프</a>                
                <a href="#">취업 지원</a>               
                <a href="#">FAQ</a>              
                <a href="#">무료 콘텐츠</a>
                <a href="#">이벤트</a>
                   
            </nav>

            <a href="#"  class="login">
              
                <span class="profile">●</span>
                   김스파르타

            </a>

        </div>
    </header>
    <section class="sparta">

        <!-- <img src="./images/banner.png" alt="내일을 바꾸는 도전 메인 배너"> -->
         <div class="banner-inner">
            <div class="banner-title">내일을 바꾸는 도전</div>
            <div class="banner-subtitle">No.1 부트캠프, 스파르타클럽 내일 배움카드</div>
         </div>
        
    </section>

    <main>

        <h1 class="main-title">AI 시대에 대응하는 직무 역량 부트캠프 </h1>

        <h2 class="sub-title">마감 임박! 자리가 얼마 안 남았어요</h2>

         <article class="course-card">

            <img src="./images/course1.png" alt="제조업 품질관리">

            <div class="course-name">제조업 품질관리</div>

            <div class="course-period">교육 기간 | 26.09.14 - 27.03.02</div>

            <div class="deadline">마감 D-day</div>

        </article>
     
    </main>

    <div class="chat">

        <div class="chat-text">문의하기</div>

        <div class="chat-circle">
            <div class="chat-inner">?</div>
        </div>

    </div>

</body>

</html>
</body>
</html>
